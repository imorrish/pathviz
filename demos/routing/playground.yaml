# The playground of the routing demo:
#
#   dev    (172.16.0.10) - the Go toolchain and the sources. It also sends the
#                          demo's requests
#   target (172.16.0.20) - the machine whose hooks are shown
#
# Start it and copy the sources to dev with "make playground DEMO=routing"
# (in the root of the repository). Then run "make demo-routing" on dev.
kind: playground
name: flexbox
playground:
  networks:
    - name: local
      subnet: 172.16.0.0/24
  machines:
    - name: dev
      users:
        - name: root
        - name: laborant
          default: true
      drives:
        - source: golang
          mount: /
          size: 30GiB
      network:
        interfaces:
          - network: local
            address: 172.16.0.10/24
      resources:
        cpuCount: 4
        ramSize: 4GiB
    - name: target
      users:
        - name: root
        - name: laborant
          default: true
      drives:
        - source: ubuntu-24-04
          mount: /
          size: 20GiB
      network:
        interfaces:
          - network: local
            address: 172.16.0.20/24
      resources:
        cpuCount: 2
        ramSize: 2GiB
  tabs:
    - id: terminal-dev
      kind: terminal
      name: dev
      machine: dev
    - id: terminal-target
      kind: terminal
      name: target
      machine: target
    - id: pathviz
      kind: http-port
      name: pathviz
      machine: target
      number: 7070
